{% extends "base.html" %}
{% block title %}Today{% endblock %}
{% block content %}
    <h1>Today</h1>
    <p class="hint">Episodes airing today, tomorrow, and the day after — for shows you're watching or have on your watchlist.</p>
    <table class="table" id="today-table">
        <thead>
            <tr><th>Day</th><th>Time</th><th>TV Show</th><th>Episode</th></tr>
        </thead>
        <tbody><tr><td colspan="4" class="hint">Loading...</td></tr></tbody>
    </table>
{% endblock %}
{% block scripts %}
<script>
async function load() {
    const res = await fetch('/api/library/today');
    const data = await res.json();
    const tbody = document.querySelector('#today-table tbody');
    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="hint">Nothing scheduled in the next 3 days.</td></tr>';
        return;
    }
    tbody.innerHTML = data.map(e => `
        <tr>
            <td>${e.day_label} <span class="hint">(${formatDate(e.air_date)})</span></td>
            <td>${e.air_time || '—'}</td>
            <td>${e.title}</td>
            <td>${e.code}${e.episode_title ? ' — ' + e.episode_title : ''}</td>
        </tr>
    `).join('');
}
load();
</script>
{% endblock %}
